<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="MySync - Personal Finance Manager" />
    <link rel="icon" type="image/png" href="/mysync/icon-192.png" />
    <link rel="apple-touch-icon" href="/mysync/icon-192.png" />
    <title>MySync</title>
    <!--
      Restores the route saved by public/404.html so SPA deep links work on
      GitHub Pages. Runs before the app mounts. No-op in normal navigation.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
